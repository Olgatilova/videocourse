:root{
  --blue:#2e4a7c; --blue-d:#243b66; --blue-dd:#1b2d4f;
  --cream:#f6eedf; --gold:#f4d078; --gold-d:#e5bd5a;
  --mut:rgba(246,238,223,.78); --line:rgba(246,238,223,.2); --card:rgba(255,255,255,.07);
  --head:"Oswald","Arial Narrow","Roboto Condensed","Franklin Gothic Medium",Impact,sans-serif;
  --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --pad:20px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--blue);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--blue);color:var(--cream);font:16px/1.6 var(--body);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
img,svg{max-width:100%}
a{color:var(--gold)}
p{margin:0 0 14px}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}

/* ---------- верхняя панель ---------- */
.top{position:-webkit-sticky;position:sticky;top:0;z-index:40;background:rgba(36,59,102,.97);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top)}
.top .wrap{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.brand{display:none;font:700 19px/1 var(--head);text-transform:uppercase;letter-spacing:.03em;color:var(--cream);text-decoration:none;margin-right:28px;white-space:nowrap}
.brand b{color:var(--gold);font-weight:700}
.tabs{display:-webkit-flex;display:flex;-webkit-flex:1;flex:1;min-width:0}
.tabs a{-webkit-flex:1;flex:1;text-align:center;text-decoration:none;color:var(--mut);font:600 10px/1.1 var(--head);
  letter-spacing:.06em;text-transform:uppercase;padding:12px 2px 9px;border-bottom:3px solid transparent;margin:0 2px;
  position:relative;transition:color .2s}
.tabs a:before{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--line);transition:background .2s}
.tabs a.on{color:var(--gold)}
.tabs a.on:before{background:var(--gold)}
.top .top-btn{display:none}

/* ---------- кнопки ---------- */
.btn{display:inline-block;text-align:center;text-decoration:none;cursor:pointer;border:0;border-radius:14px;
  font:700 18px/1.15 var(--head);text-transform:uppercase;letter-spacing:.05em;padding:17px 26px;
  background:var(--gold);color:var(--blue-dd);transition:background .2s,transform .2s;min-height:52px}
.btn:hover{background:var(--gold-d)}
.btn.ghost{background:transparent;color:var(--cream);border:1.5px solid var(--gold);padding:15.5px 24px}
.btn.ghost:hover{background:rgba(244,208,120,.12)}
.btn.block{display:block;width:100%}
.btn[aria-disabled="true"]{opacity:.5}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:6px}

/* ---------- секции ---------- */
.sec{padding:52px 0 8px}
.sec.alt{background:var(--blue-d);padding-bottom:52px;margin-top:44px}
.sec + .sec{margin-top:0}
.sec[id]{scroll-margin-top:46px}
.lab{font:600 13px/1 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 12px}
h1,h2,h3{margin:0;text-transform:uppercase;font-family:var(--head);font-weight:700}
h2{font-size:clamp(30px,8.2vw,46px);line-height:1.05;margin-bottom:18px;max-width:20em}
h3{font-size:22px;line-height:1.1;letter-spacing:.01em;margin:36px 0 14px}
.lead{font-size:18px;color:var(--mut);max-width:42em}


/* ---------- видео на подложке ---------- */
.bg{position:absolute;left:0;top:0;right:0;bottom:0;background:#1b2d4f center/cover no-repeat}
.bg video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s}
@-webkit-keyframes kb{from{-webkit-transform:scale(1);transform:scale(1)}to{-webkit-transform:scale(1.09);transform:scale(1.09)}}
@keyframes kb{from{-webkit-transform:scale(1);transform:scale(1)}to{-webkit-transform:scale(1.09);transform:scale(1.09)}}
.bg.kb{-webkit-animation:kb 16s ease-in-out infinite alternate;animation:kb 16s ease-in-out infinite alternate}
.bg video.on{opacity:.6}
.shade{position:absolute;left:0;top:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(27,45,79,.5) 0%,rgba(36,59,102,.55) 45%,rgba(36,59,102,.92) 100%)}
.hero{position:relative;overflow:hidden}
.hero>.wrap{position:relative}
.vband{position:relative;overflow:hidden;padding:52px 0 40px;margin-top:44px}
.vband .bg video.on{opacity:.75}
.vband .shade{background:linear-gradient(180deg,rgba(27,45,79,.7) 0%,rgba(27,45,79,.5) 55%,rgba(27,45,79,.9) 100%)}
.vband>.wrap{position:relative}
.vband .les{margin-top:24px}
.vband details{background:rgba(9,11,16,.5)}
.sec.hasband{padding-top:0;margin-top:0}
.sec.alt.hasband{margin-top:44px}
@media (max-aspect-ratio:1/1){
  .hero .bg{background-size:100% auto;background-position:center top}
  .hero .bg video{bottom:auto;height:56.25vw;-webkit-mask-image:linear-gradient(180deg,#000 60%,transparent);mask-image:linear-gradient(180deg,#000 60%,transparent)}
  .hero .bg video.on{opacity:.8}
  .hero .shade{background:linear-gradient(180deg,rgba(27,45,79,.35) 0%,rgba(36,59,102,.15) 20%,rgba(36,59,102,.85) 45%,rgba(36,59,102,.97) 100%)}
}
@media (min-width:960px){.vband{padding:84px 0 60px}}

/* ---------- первый экран ---------- */
.hero{padding:30px 0 12px}
.hero-grid{display:block}
.kicker{font:600 13px/1.3 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
h1{font-size:clamp(40px,12vw,84px);line-height:.98;letter-spacing:.005em;margin-bottom:14px}
h1 .hl{display:inline-block;white-space:nowrap;background:var(--gold);color:var(--blue);padding:.04em .16em .02em;border-radius:14px;margin-top:6px}
.sub{font-size:clamp(18px,4.6vw,24px);line-height:1.35;color:var(--mut);margin:16px 0 14px;max-width:24em}
.hero .lead{font-size:17px;margin-bottom:24px}
.cta-row .btn{display:block;margin:0 0 10px 0}
.pricecard{background:var(--blue-d);border:1.5px solid var(--gold);border-radius:22px;padding:22px 20px 20px;margin-top:26px}
.pricecard .p{font:700 56px/1 var(--head);color:var(--gold);margin:0}
.pricecard .p small{display:block;font:500 14px/1.35 var(--body);color:var(--mut);margin-top:6px}
.mini{list-style:none;padding:0;margin:16px 0 18px}
.mini li{padding:9px 0 9px 28px;border-top:1px solid var(--line);position:relative;font-size:15px}
.mini li:last-child{border-bottom:1px solid var(--line)}
.mini li:before{content:"";position:absolute;left:4px;top:15px;width:11px;height:6px;border-left:2.5px solid var(--gold);border-bottom:2.5px solid var(--gold);transform:rotate(-45deg)}

/* ---------- карточки ---------- */
.grid{display:grid;grid-template-columns:1fr;grid-gap:12px;gap:12px;margin:22px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 20px 18px}
.card b{display:block;font-size:18px;line-height:1.3;margin:0 0 8px}
.card p{margin:0;color:var(--mut);font-size:16px}
.card.gold{border-left:4px solid var(--gold)}
.card p.big{font:700 40px/1 var(--head);color:var(--gold);margin:0 0 10px;white-space:nowrap}
.card p.big span{font:600 15px/1 var(--body);color:var(--mut);margin-right:6px;letter-spacing:0}

.costbox{margin:22px 0 0;max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 20px}
.cgrp{padding:16px 0}
.cgrp + .cgrp{border-top:1px solid var(--line)}
.crow{display:-webkit-flex;display:flex;-webkit-align-items:baseline;align-items:baseline;-webkit-justify-content:space-between;justify-content:space-between;grid-gap:14px;gap:14px;padding:3px 0}
.crow .cn{font-size:17px;font-weight:600}
.crow .cp{font-size:16px;color:var(--mut);text-align:right}
.crow .cp.pick{font-size:14px}
.crow.nested{padding-left:14px}
.crow.nested .cn{font-weight:500;font-size:16px}
.costbox .or{padding:2px 0 2px 14px;font-size:13px;color:var(--gold)}
.cgrp p.cd{margin:8px 0 0;font-size:15px;color:var(--mut)}
.sec.alt .costbox{background:rgba(255,255,255,.06)}
.cost{grid-template-columns:1fr;max-width:860px}
.card p.pick{color:var(--gold);font-weight:600;font-size:14px;margin:0 0 6px}
.opts{margin:0 0 12px}
.opt{display:-webkit-flex;display:flex;-webkit-align-items:baseline;align-items:baseline;-webkit-justify-content:space-between;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(255,255,255,.05)}
.opt .ol{font:700 22px/1 var(--head);text-transform:uppercase;letter-spacing:.03em}
.card .opt p.big{margin:0;font-size:30px}
.opts .or{text-align:center;font:600 13px/1 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding:7px 0}
.card b + p.big{margin-top:2px}
.sec.alt .card{background:rgba(255,255,255,.06)}
.after{margin-top:22px;max-width:42em}

/* ---------- программа ---------- */
.les{display:grid;grid-template-columns:1fr;grid-gap:10px;gap:10px;margin:22px 0 0;align-items:start}
details{background:var(--card);border:1px solid var(--line);border-radius:16px}
details[open]{border-color:rgba(244,208,120,.55)}
summary{list-style:none;cursor:pointer;padding:16px 46px 16px 16px;position:relative;display:-webkit-flex;display:flex;-webkit-align-items:flex-start;align-items:flex-start}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";position:absolute;right:16px;top:50%;margin-top:-14px;font:600 26px/28px var(--head);color:var(--gold)}
details[open] > summary:after{content:"\2212"}
.n{font:700 30px/1 var(--head);color:var(--gold);min-width:46px}
.t{font-size:17px;font-weight:600;line-height:1.3;padding-top:2px}
.dbody{padding:0 16px 16px 62px;color:var(--mut);font-size:15.5px}
.dbody p{margin:0 0 8px}
.dbody p:last-child{margin:0}
.dbody strong{color:var(--cream);font-weight:600}
.faq details{margin:0 0 10px}
.faq summary{padding-left:18px}
.faq .t{padding-top:0}
.faq .dbody{padding:0 18px 18px 18px;font-size:16px}
.faq{max-width:860px;margin-top:22px}

.note{background:var(--cream);color:var(--blue-dd);border-radius:18px;padding:20px;margin:26px 0 0}
.note b{display:block;font:700 20px/1.1 var(--head);text-transform:uppercase;margin:0 0 10px}
.note p{margin:0 0 10px}
.note p:last-child{margin:0}

/* ---------- автор ---------- */
.who{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:780px;margin-top:22px}
.who .nm{font:700 30px/1.05 var(--head);text-transform:uppercase;margin:0}
.who .rl{color:var(--gold);margin:6px 0 16px;font-weight:600}
.who.hasph{display:grid;grid-template-columns:1fr;grid-gap:18px;gap:18px}
.who .ph{width:132px;height:132px;object-fit:cover;border-radius:50%;border:2px solid var(--gold);display:block}
.soft{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:780px}
.soft b{display:block;font:700 26px/1.1 var(--head);text-transform:uppercase;margin:0 0 8px}
.soft p{color:var(--mut);margin:0 0 16px}
.soft .cta-row .btn{margin:0 0 10px 0}
@media (min-width:640px){.who.hasph{grid-template-columns:168px 1fr;grid-gap:28px;gap:28px}.who .ph{width:168px;height:168px}.soft .cta-row .btn{display:inline-block;margin:0 10px 0 0}}
.who .pf small{display:block;margin-top:8px;font-size:12px;color:var(--mut);max-width:168px}
.pills{margin-top:8px}
.pills a{display:inline-block;text-decoration:none;color:var(--cream);border:1px solid var(--gold);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600;margin:0 8px 8px 0}
.quote{border-left:4px solid var(--gold);padding:2px 0 2px 14px;margin:0 0 12px;max-width:780px}
.quote small{color:var(--mut)}

/* ---------- оплата ---------- */
.offer{background:var(--blue-d);border:1.5px solid var(--gold);border-radius:24px;padding:24px 20px 22px;margin-top:8px;scroll-margin-top:60px}
.sec.alt .offer{background:var(--blue-dd)}
.offer .p{font:700 62px/1 var(--head);color:var(--gold);margin:0}
.offer .p small{display:block;font:500 14px/1.35 var(--body);color:var(--mut);margin-top:6px}
.facts{list-style:none;padding:0;margin:18px 0}
.facts li{padding:10px 0;border-top:1px solid var(--line);display:-webkit-flex;display:flex}
.facts li:last-child{border-bottom:1px solid var(--line)}
.facts i{font-style:normal;color:var(--mut);min-width:84px;margin-right:10px}
.chk{display:-webkit-flex;display:flex;-webkit-align-items:flex-start;align-items:flex-start;padding:13px;border:1.5px solid var(--line);border-radius:14px;margin:0 0 8px;cursor:pointer;font-size:15px;line-height:1.45;transition:border-color .2s,background .2s}
.chk input{width:22px;height:22px;margin:1px 12px 0 0;-webkit-flex:none;flex:none;accent-color:#f4d078}
.chk.err{border-color:#ffb4a8;background:rgba(255,180,168,.12)}
.chk.ok{border-color:rgba(244,208,120,.65)}
.hint{min-height:22px;font-size:14px;margin:10px 2px 0;color:var(--mut)}
.hint.err{color:#ffb4a8}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.fine{font-size:13px;color:var(--mut);margin:14px 0 0;max-width:46em}

/* ---------- подвал ---------- */
footer{margin-top:0;padding:30px 0 14px;border-top:1px solid var(--line);font-size:13px;color:var(--mut);background:var(--blue)}
footer a{color:var(--mut)}
footer p{margin:0 0 8px}

/* ---------- плавающая кнопка на телефонах ---------- */
.fab{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));-webkit-transform:translate(-50%,130px);transform:translate(-50%,130px);
  z-index:35;background:var(--gold);color:var(--blue-dd);text-decoration:none;border-radius:999px;padding:15px 26px;
  font:700 17px/1 var(--head);text-transform:uppercase;letter-spacing:.05em;box-shadow:0 8px 24px rgba(0,0,0,.35);
  transition:transform .3s;white-space:nowrap}
.fab.show{-webkit-transform:translate(-50%,0);transform:translate(-50%,0)}

/* ---------- планшет ---------- */
@media (min-width:640px){
  :root{--pad:28px}
  .cta-row .btn{display:inline-block;margin:0 10px 10px 0}
  .grid.c2,.grid.c3{grid-template-columns:1fr 1fr}
  .grid.t3{grid-template-columns:1fr 1fr 1fr}

  .les{grid-template-columns:1fr 1fr;grid-gap:12px;gap:12px}
  .tabs a{font-size:12px}
}

  .hero{padding:78px 0 34px}
  .hero-grid{display:grid;grid-template-columns:1.3fr .8fr;grid-gap:56px;gap:56px;-webkit-align-items:center;align-items:center}
  .hero .lead{font-size:19px}
  .pricecard{margin-top:0;padding:30px 28px 26px}

  .grid.c3{grid-template-columns:1fr 1fr 1fr;grid-gap:16px;gap:16px}

  .offer .p{font-size:76px}

  .who{padding:32px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.fab,.chk,.btn,.tabs a{transition:none}.shake{animation:none}}

/* читаемость: светлее основной текст и подписи, заметные вторичные кнопки */
.card p,.dbody p,.note p,.who p,.lead,.soft p,.facts span{color:rgba(246,238,223,.93)}
.card p{font-size:17px}
.dbody p,.note p{font-size:16.5px}
.fine{font-size:14px;color:rgba(246,238,223,.85)}
.who .pf small{font-size:13px;color:rgba(246,238,223,.85)}
.soft .btn.ghost{background:rgba(244,208,120,.16);border:1.5px solid var(--gold);color:#fff;font-weight:700}
.soft .btn.ghost:hover{background:rgba(244,208,120,.3)}
.pills a{background:rgba(244,208,120,.14);color:#fff}
.card b{font-size:20px}
.t{font-size:19px}
.note p{color:var(--blue-dd);font-size:16.5px}
.note b{font-size:22px}
.faq .t{font-size:19px}
.ctaa{margin-top:28px}
.softwrap{padding:8px 0 40px}
.softwrap .soft{margin-top:24px}

/* ---------- наведение курсора (только мышь) ---------- */
details{transition:background .2s,border-color .2s}
summary:after{transition:color .2s,-webkit-transform .2s,transform .2s}
.pills a{transition:background .2s,border-color .2s}
@media (hover:hover){

    p.appendChild(link("Согласие на обработку персональных данных", D.docs.consent));
    var mail = h("p"); mail.appendChild(document.createTextNode("Связаться: "));
    var ma = h("a", "", D.email); ma.href = "mailto:" + D.email; mail.appendChild(ma);
    add(w, p, h("p", "", D.seller), mail);
    app.appendChild(f);
  })();

  /* ссылки наружу: внутри Telegram открываем через его API */
  document.addEventListener("click", function (e) {
    var el = e.target, a = null;
    while (el && el !== document) { if (el.tagName === "A" && el.getAttribute("data-ext")) { a = el; break; } el = el.parentNode; }
    if (!a || !inTg) return;
    e.preventDefault();
    openExternal(a.getAttribute("href"));
  });

  /* подсветка текущего раздела */
  var links = nav.querySelectorAll("a");
  function setOn(i) { for (var k = 0; k < links.length; k++) { if (k === i) links[k].classList.add("on"); else links[k].classList.remove("on"); } }
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (ents) {
      ents.forEach(function (en) {
        if (!en.isIntersecting) return;
        var n = en.target.id === "buy" ? 5 : parseInt(en.target.id.slice(1), 10);
        setOn(n - 1);
      });
    }, { rootMargin: "-35% 0px -60% 0px" });
    ["s1", "s2", "s3", "s4", "s5", "buy"].forEach(function (id) { var el = document.getElementById(id); if (el) io.observe(el); });
  }

  /* плавающая кнопка на телефонах: видна, пока блок оплаты ниже экрана */
  var fab = document.getElementById("fab"), offerEl = document.getElementById("buy"), tick = false;
  fab.textContent = D.offer.fab;
  function fabCheck() {
    tick = false;
    var r = offerEl.getBoundingClientRect();
    if (window.pageYOffset > 420 && r.top > window.innerHeight * 0.85) fab.classList.add("show");
    else fab.classList.remove("show");
  }
  window.addEventListener("scroll", function () { if (!tick) { tick = true; requestAnimationFrame(fabCheck); } }, { passive: true });
  window.addEventListener("resize", fabCheck);
  fabCheck();
})();
</script>
